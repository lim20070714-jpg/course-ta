# CourseTA 前端站点配置（nginx）
# 由 web/Dockerfile 复制到 /etc/nginx/conf.d/default.conf。
# 上游服务名 "api" 来自 docker-compose.yml 里的服务名，因此两个容器必须在同一 compose 网络中。

upstream courseta_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 课件/试卷上传：nginx 默认只有 1m，不改会直接 413
    client_max_body_size 512m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # 代理响应（含 SSE）不压缩，避免多一层缓冲
    gzip_proxied off;

    # ------------------------------------------------------------------
    # 所有反代共用的设置：SSE 必须关闭缓冲，否则答案会攒到最后一次性吐出
    # ------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;

    # AI 生成长答案 / 批改可以持续数分钟；非流式接口（如 /hint）同样可能很慢
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # ---- API：与前端同源，因此同源部署完全不需要 CORS ----
    location /api/ {
        proxy_pass http://courseta_api;
    }

    # ---- FastAPI 交互式文档（不在 /api 前缀下，一并反代，便于部署后直接打开）----
    location = /docs {
        proxy_pass http://courseta_api/docs;
    }

    # Swagger UI 的 oauth2-redirect 等子路径
    location /docs/ {
        proxy_pass http://courseta_api;
    }

    location = /redoc {
        proxy_pass http://courseta_api/redoc;
    }

    location = /openapi.json {
        proxy_pass http://courseta_api/openapi.json;
    }

    # ---- 前端静态资源：带内容哈希，可长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

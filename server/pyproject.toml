[project]
name = "course-ta-server"
version = "0.1.0"
description = "CourseTA backend: a citation-backed AI teaching assistant for any course"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-pptx>=1.0",
    "sympy>=1.13",
    "pymupdf>=1.28.2",
    "antlr4-python3-runtime>=4.11,<4.12",
    "lark>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
